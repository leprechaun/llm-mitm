[project]
name = "llm-mitm"
version = "0.1.0"
description = "Minimal OpenAI-compatible proxy for Bedrock and Ollama with per-API-key cost tracking"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "boto3>=1.35",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "prometheus-client>=0.21",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
# This is a flat (non-packaged) layout, so without this `uv run pytest`
# can't import llm_mitm -- only `uv run python -m pytest` could.
pythonpath = ["."]
